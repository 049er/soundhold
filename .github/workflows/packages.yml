name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cargo rustc pkg-config clang libclang-dev libpipewire-0.3-dev libgtk-4-dev libadwaita-1-dev dpkg-dev gh git ca-certificates
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --workspace
      - name: Build packages
        run: sh packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/deb/*.deb
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/deb/*.deb --repo "$GITHUB_REPOSITORY" --generate-notes
