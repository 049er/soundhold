[package]
name = "soundhold"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
libc = "0.2"
pipewire = "0.10"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
