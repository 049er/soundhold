context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
      args = { }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Soundhold"
        media.name       = "Soundhold"
        filter.graph = {
          nodes = [
            { type = builtin label = copy name = copyL }
            { type = builtin label = copy name = copyR }
            { type = builtin label = mixer name = mid
              control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
            { type = builtin label = linear name = invR
              control = { "Mult" = -1.0 } }
            { type = builtin label = mixer name = sideL
              control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
            { type = builtin label = linear name = sideR
              control = { "Mult" = -1.0 } }
            { type = sofa label = spatializer name = spC
              config = {
                filename = "@SOFA@"
                blocksize = 256
                tailsize = 1024
              }
              control = { "Azimuth" = 0.0 "Elevation" = 0.0 "Radius" = 1.0 }
            }
            { type = sofa label = spatializer name = spL
              config = {
                filename = "@SOFA@"
                blocksize = 256
                tailsize = 1024
              }
              control = { "Azimuth" = 45.0 "Elevation" = 0.0 "Radius" = 1.0 }
            }
            { type = sofa label = spatializer name = spR
              config = {
                filename = "@SOFA@"
                blocksize = 256
                tailsize = 1024
              }
              control = { "Azimuth" = 315.0 "Elevation" = 0.0 "Radius" = 1.0 }
            }
            { type = builtin label = mixer name = outL
              control = { "Gain 1" = 0.9 "Gain 2" = 0.9 "Gain 3" = 0.9 "Gain 4" = 0.0 } }
            { type = builtin label = mixer name = outR
              control = { "Gain 1" = 0.9 "Gain 2" = 0.9 "Gain 3" = 0.9 "Gain 4" = 0.0 } }
          ]
          links = [
            { output = "copyL:Out" input = "mid:In 1" }
            { output = "copyR:Out" input = "mid:In 2" }
            { output = "copyR:Out" input = "invR:In" }
            { output = "copyL:Out" input = "sideL:In 1" }
            { output = "invR:Out" input = "sideL:In 2" }
            { output = "sideL:Out" input = "sideR:In" }
            { output = "mid:Out" input = "spC:In" }
            { output = "sideL:Out" input = "spL:In" }
            { output = "sideR:Out" input = "spR:In" }
            { output = "spC:Out L" input = "outL:In 1" }
            { output = "spL:Out L" input = "outL:In 2" }
            { output = "spR:Out L" input = "outL:In 3" }
            { output = "copyL:Out" input = "outL:In 4" }
            { output = "spC:Out R" input = "outR:In 1" }
            { output = "spL:Out R" input = "outR:In 2" }
            { output = "spR:Out R" input = "outR:In 3" }
            { output = "copyR:Out" input = "outR:In 4" }
          ]
          inputs  = [ "copyL:In" "copyR:In" ]
          outputs = [ "outL:Out" "outR:Out" ]
        }
        capture.props = {
          node.name      = "effect_input.soundhold.@GEN@"
          media.class    = Audio/Sink
          audio.channels = 2
          audio.position = [ FL FR ]
        }
        playback.props = {
          node.name      = "effect_output.soundhold.@GEN@"
          node.passive   = true
          audio.channels = 2
          audio.position = [ FL FR ]
          target.object  = "@TARGET@"
        }
      }
    }
]
